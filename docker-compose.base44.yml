# Base44 sandbox environment for this repository.
#
# The project is one static page (`index.html`) with no build step, no package
# manifest and no backend, so it is served directly from the bind-mounted
# working tree by a plain nginx image and there is nothing to install. Serving
# from the checkout means edits to `index.html` show up on the next page load
# (there is no bundler to re-run).
#
# No external credentials are required: the page runs entirely in the browser
# against localStorage, and its one optional remote integration is skipped
# while `GOOGLE_SHEETS_SCRIPT_URL` in index.html is left at its placeholder.
#
# Usage: docker compose -f docker-compose.base44.yml up -d
name: daniel-website

services:
  web:
    image: nginx:alpine
    # The sandbox checkout is mounted with owner-only permissions (0700), which
    # the image's unprivileged `nginx` worker cannot traverse (403 on every
    # request). Make the served tree world-readable before starting, so nginx
    # keeps running as its own unprivileged user. Permissive read bits on a
    # single-tenant sandbox are preferable to serving as root.
    command: ["sh", "-ec", "chmod -R a+rX /usr/share/nginx/html && exec nginx -g 'daemon off;'"]
    ports:
      # Host port 3000 is the preview entry point.
      - "3000:80"
    volumes:
      # Mounted read-write only so the startup chmod below can run; nginx itself
      # serves as its unprivileged `nginx` user and never writes to the tree.
      - .:/usr/share/nginx/html
      # Sandbox-only server block: serves the site and refuses dot-paths, so
      # .git/ and .base44/ are never reachable over the public preview URL.
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    healthcheck:
      # Read-only probe of the served page (busybox wget ships with the image).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q 'Daniel' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      base44.project: "Daniel's Website"
      base44.kind: "web"
      base44.port: "3000"
