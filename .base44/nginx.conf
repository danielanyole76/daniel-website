# Sandbox-only nginx server block, mounted into the `web` service by
# docker-compose.base44.yml. The project has no nginx config of its own; this
# exists so the static checkout can be served on host port 3000 without
# exposing repository internals (mounting the repo root otherwise serves .git
# and .base44 over the public preview URL).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Never serve dot-files or dot-directories (.git, .base44, ...).
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
